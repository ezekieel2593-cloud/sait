<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена | SAIT</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .err { min-height: 78vh; display: grid; place-items: center; text-align: center; padding: 40px 0; }
    .err__code { font-size: clamp(5rem, 18vw, 11rem); font-weight: 800; letter-spacing: -0.05em; line-height: 1;
      background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .err h1 { font-size: clamp(1.4rem, 3.5vw, 2rem); margin: 10px 0 12px; }
    .err p { color: var(--text-dim); max-width: 460px; margin: 0 auto 28px; }
    .err__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="header is-stuck">
    <div class="container header__inner">
      <a class="logo" href="/" aria-label="SAIT — на главную">
        <svg class="logo__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="9" stroke="currentColor" stroke-width="2"/>
          <path d="M10 21c1.6 1.3 3.6 2 5.8 2 3.1 0 5.2-1.5 5.2-3.7 0-2-1.4-3.1-4.4-3.8l-1.6-.4c-1.2-.3-1.7-.7-1.7-1.4 0-.8.8-1.3 2-1.3 1.4 0 2.7.5 3.8 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo__text">SAIT</span>
      </a>
    </div>
  </header>

  <main class="container err">
    <div>
      <p class="err__code">404</p>
      <h1>Такой страницы нет</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там всё на месте.</p>
      <div class="err__actions">
        <a class="btn btn--primary btn--lg" href="/">На главную</a>
        <a class="btn btn--ghost btn--lg" href="/#contact">Написать нам</a>
      </div>
    </div>
  </main>
</body>
</html>
