name: Деплой на хостинг (FTP)

# Автодеплой сайта на shared-хостинг (Cloud4box, панель ISPmanager) по FTP.
#
# Как работает:
#  1. push в main → сборка пакета для PHP-хостинга → проверки → загрузка по FTP;
#  2. кнопка «Run workflow» — быстрый режим: заливается готовый архив
#     download/astra-pearl-php.zip, без сборки и Node-тестов (~1 минута);
#  3. чтобы залить сайт из текущей ветки, не вливая её в main, запустите workflow
#     вручную и укажите эту ветку.
#
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_HOST      — хост из панели: домен сайта или IP сервера
#   FTP_USER      — логин FTP
#   FTP_PASSWORD  — пароль FTP
#   FTP_DIR       — корневая папка сайта из ISPmanager (например /www/cosmorox.ru)
#
#   SITE_URL      — необязательная замена домена для HTTP-проверки после деплоя.
#                   По умолчанию используется https://cosmorox.ru.
#
# Этого достаточно. FTP_PORT и FTP_SECURE добавлять не нужно — обычный FTP
# работает по умолчанию; FTPS включается только если хостинг его требует.
#
# config.php, data/ и setup.php скрипт деплоя не трогает: пароль владельца
# и заявки остаются на сервере, см. scripts/deploy-ftp.ts.
#
# После загрузки workflow проверяет публикацию: деплой кладёт файл-зонд
# deploy-probe-<коммит>.txt, и если он не открывается на домене — значит
# FTP_DIR указывает не на корень документов домена (или домен смотрит на
# другой сервер). Главные бандлы собираются с отпечатком в имени
# (app-<id>.js), поэтому кэш хостинга не может отдать прежнюю версию.

on:
  push:
    branches:
      - main
      # Рабочая ветка проекта: каждый push в неё публикуется автоматически.
      - arena/46865502-sait
  # Кнопка «Run workflow» в разделе Actions — залить сайт без нового коммита.
  workflow_dispatch:
    inputs:
      prune:
        description: "Удалить на сервере файлы, которых больше нет в сборке"
        type: boolean
        default: false
      from_archive:
        description: "Залить готовый архив из download/ (быстро, без сборки и Node-тестов)"
        type: boolean
        default: true

# Два деплоя одновременно не нужны: второй ждёт первый.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Сборка и загрузка
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Зависимости нужны всегда: скрипту деплоя требуется basic-ftp.
      # В быстром режиме не запускаем типы, тесты и сборку — это экономит минуты.
      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Типы
        if: ${{ !inputs.from_archive }}
        run: npx tsc --noEmit

      - name: Тесты
        if: ${{ !inputs.from_archive }}
        run: npm test

      # Пакет уже собран (архив в download/) — тогда отдельная сборка не нужна.
      - name: Сборка пакета для хостинга
        if: ${{ !inputs.from_archive }}
        run: npm run build:php

      - name: Распаковать готовый архив из download/
        if: ${{ inputs.from_archive }}
        run: |
          mkdir -p /tmp/php-release
          unzip -q download/astra-pearl-php.zip -d /tmp/php-release
          # В архиве сайт лежит в подпапке astra-pearl-php/ — берём её содержимое.
          if [ -f /tmp/php-release/astra-pearl-php/index.html ]; then
            mv /tmp/php-release/astra-pearl-php/* /tmp/php-release/
            mv /tmp/php-release/astra-pearl-php/.[!.]* /tmp/php-release/ 2>/dev/null || true
          fi
          test -f /tmp/php-release/index.html

      # Проверки собранного пакета — только в полном режиме.
      - name: Проверки пакета и деплоя
        if: ${{ !inputs.from_archive }}
        run: |
          node tools/php-checks/admin-view.cjs
          node tools/php-checks/deploy-ftp.cjs

      - name: Загрузка на хостинг по FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || 'public_html' }}
          DEPLOY_SOURCE: ${{ inputs.from_archive && '/tmp/php-release' || '' }}
          # --no-build: пакет уже собран шагом выше.
          # --prune включается галочкой при ручном запуске.
          DEPLOY_ARGS: ${{ inputs.prune && '--prune' || '' }}
        run: npx tsx scripts/deploy-ftp.ts --no-build $DEPLOY_ARGS

      # Проверяем домен после FTP-загрузки: зонд, версия страницы, версия бандла.
      # Проверка работает и в быстром режиме (архив из download/), и в полном.
      - name: Проверка публикации на домене
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://cosmorox.ru' }}
          RELEASE_DIR: ${{ inputs.from_archive && '/tmp/php-release' || 'release/php' }}
        run: |
          set -e
          echo "Проверяю $SITE_URL (локальная сборка: $RELEASE_DIR)"

          # 1. Зонд: файл, загруженный деплоем, обязан открываться на домене.
          probe_code=$(curl -sS -o /tmp/probe.txt -w "%{http_code}" --max-time 30 "$SITE_URL/deploy-probe-$GITHUB_SHA.txt")
          echo "deploy-probe: HTTP $probe_code"
          if [ "$probe_code" != "200" ] || ! grep -q "$GITHUB_SHA" /tmp/probe.txt; then
            echo "::error::Загруженные по FTP файлы не видны на домене. Значит FTP_DIR указывает не на корень документов домена (в ISPmanager это каталог сайта, например /www/cosmorox.ru или public_html), либо домен смотрит на другой сервер. Проверьте секрет FTP_DIR и привязку домена в панели."
            exit 1
          fi
          echo "Зонд найден на домене — загрузка попала в корень сайта."

          # 2. Главная должна ссылаться на бандл именно этой сборки.
          local_app=$(grep -o 'app-[0-9a-f]\{8\}\.js' "$RELEASE_DIR/index.html" | head -n 1)
          local_app=${local_app:-app.js}
          home_code=$(curl -sS -o /tmp/home.html -w "%{http_code}" --max-time 30 "$SITE_URL/?nocache=$RANDOM$RANDOM")
          echo "Главная: HTTP $home_code"
          test "$home_code" = "200"
          grep -qi "жемчужина" /tmp/home.html || echo "Название сайта в HTML главной не найдено"
          live_app=$(grep -o 'app-[0-9a-f]\{8\}\.js' /tmp/home.html | head -n 1)
          echo "Бандл локальной сборки: $local_app, бандл на домене: ${live_app:-не найден}"
          if [ "$live_app" != "$local_app" ]; then
            echo "::error::Домен отдаёт прежнюю версию страницы (${live_app:-старая} вместо $local_app). HTML на сервере не обновился: проверьте FTP_DIR и кэширование статики в панели хостинга."
            exit 1
          fi

          # 3. Сам бандл: внутри должна быть новая сборка (маркер портала).
          app_code=$(curl -sSL -o /tmp/site-app.js -w "%{http_code}" --max-time 60 "$SITE_URL/$local_app?deploy=$GITHUB_SHA")
          echo "$local_app: HTTP $app_code"
          test "$app_code" = "200"
          if ! grep -q "portal-landing" /tmp/site-app.js; then
            echo "::error::Файл $local_app на домене — не новая сборка. Проверьте FTP_DIR и кэширование в панели хостинга."
            exit 1
          fi
          echo "Маркер новой сборки найден в $local_app."

          # 4. Диагностика хостинга (PHP, права, config.php) доступна.
          check_code=$(curl -sS -o /tmp/check.html -w "%{http_code}" --max-time 30 "$SITE_URL/check.php")
          echo "check.php: HTTP $check_code"

      # Если публикация не подтвердилась — показываем, куда реально попала
      # загрузка: в логе будет видна структура каталогов FTP-входа.
      - name: Диагностика каталогов FTP
        if: failure()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || 'public_html' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_SECURE: ${{ secrets.FTP_SECURE || '0' }}
        run: npx tsx scripts/ftp-inspect.ts

      - name: Итог
        if: always()
        run: |
          {
            echo "### Деплой: ${{ job.status }}"
            echo ""
            echo "Ветка: \`${{ github.ref_name }}\`, коммит: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
