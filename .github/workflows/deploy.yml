name: Деплой на хостинг (FTP)

# Автодеплой сайта на shared-хостинг (Cloud4box, панель ISPmanager) по FTP.
#
# Как работает:
#  1. push в main → сборка пакета для PHP-хостинга → проверки → загрузка по FTP;
#  2. кнопка «Run workflow» — быстрый режим: заливается готовый архив
#     download/astra-pearl-php.zip, без сборки и Node-тестов (~1 минута);
#  3. чтобы залить сайт из текущей ветки, не вливая её в main, запустите workflow
#     вручную и укажите эту ветку.
#
# Нужные секреты репозитория (Settings → Secrets and variables → Actions):
#   FTP_HOST      — хост из панели: домен сайта или IP сервера
#   FTP_USER      — логин FTP
#   FTP_PASSWORD  — пароль FTP
#   FTP_DIR       — папка сайта (директория), обычно public_html
#
#   SITE_URL      — необязательная замена домена для HTTP-проверки после деплоя.
#                   По умолчанию используется https://cosmorox.ru.
#
# Этого достаточно. FTP_PORT и FTP_SECURE добавлять не нужно — обычный FTP
# работает по умолчанию; FTPS включается только если хостинг его требует.
#
# config.php, data/ и setup.php скрипт деплоя не трогает: пароль владельца
# и заявки остаются на сервере, см. scripts/deploy-ftp.ts.

on:
  push:
    branches:
      - main
      # Ветка, в которой идёт разработка: деплой доступен по кнопке, push её не заливает.
      - arena/58ef96c7-sait
  # Кнопка «Run workflow» в разделе Actions — залить сайт без нового коммита.
  workflow_dispatch:
    inputs:
      prune:
        description: "Удалить на сервере файлы, которых больше нет в сборке"
        type: boolean
        default: false
      from_archive:
        description: "Залить готовый архив из download/ (быстро, без сборки и Node-тестов)"
        type: boolean
        default: true

# Два деплоя одновременно не нужны: второй ждёт первый.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Сборка и загрузка
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Зависимости нужны всегда: скрипту деплоя требуется basic-ftp.
      # В быстром режиме не запускаем типы, тесты и сборку — это экономит минуты.
      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Типы
        if: ${{ !inputs.from_archive }}
        run: npx tsc --noEmit

      - name: Тесты
        if: ${{ !inputs.from_archive }}
        run: npm test

      # Пакет уже собран (архив в download/) — тогда отдельная сборка не нужна.
      - name: Сборка пакета для хостинга
        if: ${{ !inputs.from_archive }}
        run: npm run build:php

      - name: Распаковать готовый архив из download/
        if: ${{ inputs.from_archive }}
        run: |
          mkdir -p /tmp/php-release
          unzip -q download/astra-pearl-php.zip -d /tmp/php-release
          # В архиве сайт лежит в подпапке astra-pearl-php/ — берём её содержимое.
          if [ -f /tmp/php-release/astra-pearl-php/index.html ]; then
            mv /tmp/php-release/astra-pearl-php/* /tmp/php-release/
            mv /tmp/php-release/astra-pearl-php/.[!.]* /tmp/php-release/ 2>/dev/null || true
          fi
          test -f /tmp/php-release/index.html

      # Проверки собранного пакета — только в полном режиме.
      - name: Проверки пакета и деплоя
        if: ${{ !inputs.from_archive }}
        run: |
          node tools/php-checks/admin-view.cjs
          node tools/php-checks/deploy-ftp.cjs

      - name: Загрузка на хостинг по FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || 'public_html' }}
          DEPLOY_SOURCE: ${{ inputs.from_archive && '/tmp/php-release' || '' }}
          # --no-build: пакет уже собран шагом выше.
          # --prune включается галочкой при ручном запуске.
          DEPLOY_ARGS: ${{ inputs.prune && '--prune' || '' }}
        run: npx tsx scripts/deploy-ftp.ts --no-build $DEPLOY_ARGS

      # Проверяем, что домен открывает страницу после FTP-загрузки.
      - name: HTTP-проверка домена
        if: ${{ !inputs.from_archive }}
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://cosmorox.ru' }}
        run: |
          code=$(curl -sSL -o /tmp/home.html -w "%{http_code}" --max-time 30 "$SITE_URL/")
          echo "Главная: HTTP $code ($SITE_URL)"
          test "$code" = "200"
          grep -qi "Жемчужина" /tmp/home.html || echo "Главная открылась, но название не найдено"
          check_code=$(curl -sS -o /tmp/check.html -w "%{http_code}" --max-time 30 "$SITE_URL/check.php")
          echo "check.php: HTTP $check_code"

      # Отдельно проверяем, что домен отдал именно новую сборку, а не прежний JS с HTTP 200.
      - name: Проверка версии портала на домене
        if: ${{ !inputs.from_archive }}
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://cosmorox.ru' }}
        run: |
          app_code=$(curl -sSL -o /tmp/site-app.js -w "%{http_code}" --max-time 30 "$SITE_URL/app.js?deploy=$GITHUB_SHA")
          echo "app.js: HTTP $app_code"
          test "$app_code" = "200"
          if ! grep -q "portal-landing" /tmp/site-app.js; then
            echo "::error::Сайт отдаёт старый app.js. Проверьте FTP_DIR: он должен быть корнем документов домена в ISPmanager."
            exit 1
          fi
          echo "Маркер нового портала найден в app.js."

      - name: Итог
        if: always()
        run: |
          {
            echo "### Деплой: ${{ job.status }}"
            echo ""
            echo "Ветка: \`${{ github.ref_name }}\`, коммит: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
